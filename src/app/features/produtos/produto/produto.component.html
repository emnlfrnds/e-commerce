<div class="produtos-comp">
  <h3 id="nome">
    {{ nome | uppercase }}
  </h3>
  <h3 id="preco">
    {{ valor | valorFormatado }}
  </h3>
  <h2>
    <button  id="btnSelProduto" (click)="selecionarProduto()">Selecionar {{ nome }}</button>
  </h2>
  <h2>
    <button id="btnAddAoCarrinho" (click)="adicionarAoCarrinho()" >Adicionar ao Carrinho</button>
  </h2>
</div>
